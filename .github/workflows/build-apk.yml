name: Build FNF APK
on:
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip wget build-essential libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libx11-dev libxext-dev libxrender-dev libxtst-dev \
            libtiff-dev libjpeg-dev libpng-dev libfreetype6-dev libgtk-3-dev \
            libvlc-dev libvlccore-dev

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Haxe 4.3.6
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6

      - name: Install hmm
        run: |
          haxelib --global upgrade haxelib
          haxelib --global install hmm

      - id: cache-hmm
        uses: actions/cache@v4
        with:
          path: ~/.haxelib
          key: haxe-hmm-android-${{ runner.os }}-4.3.6-${{ hashFiles('hmm.json') }}
          restore-keys: haxe-hmm-android-${{ runner.os }}-4.3.6-

      - name: Download git deps tarballs (prepare)
        if: steps.cache-hmm.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: python3 .github/install-deps.py prepare

      - name: Install haxelibs via hmm
        if: steps.cache-hmm.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          for i in {1..10}; do
            echo "Attempt $i / 10"
            if haxelib --global run hmm install -q; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Re-link git deps (dev override)
        timeout-minutes: 30
        run: python3 .github/install-deps.py dev

      - name: Rebuild lime ndll
        run: haxelib --never run lime rebuild cpp

      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          ls "$ANDROID_SDK_ROOT/ndk/"
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --version

      - name: Export Android env
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "NDK_ROOT=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build APK
        timeout-minutes: 60
        run: haxelib --never run lime build android -v -release -DGITHUB_BUILD

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Android-APK
          path: export/android/bin/**/*.apk
          if-no-files-found: warn
          retention-days: 14
