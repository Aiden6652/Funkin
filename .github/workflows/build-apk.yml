name: Build FNF APK
on:
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip wget build-essential libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libx11-dev libxext-dev libxrender-dev libxtst-dev \
            libtiff-dev libjpeg-dev libpng-dev libfreetype6-dev libgtk-3-dev \
            libvlc-dev libvlccore-dev

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Haxe 4.3.6
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.6

      - name: Fix libffi for neko (libffi.so.6 symlink - official FNF Docker does this)
        run: |
          sudo apt-get install -y libffi-dev
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libffi.so.8 /usr/lib/x86_64-linux-gnu/libffi.so.6
          ls -la /usr/lib/x86_64-linux-gnu/libffi.so.6

      - name: Install neko 2.4.1 (FunkinCrew fork ndll requires it)
        run: |
          set -e
          curl -fL https://github.com/HaxeFoundation/neko/releases/download/v2-4-1/neko-2.4.1-linux64.tar.gz -o neko-2.4.1.tar.gz
          tar -xzf neko-2.4.1.tar.gz
          NEKO_DIR=$(find . -maxdepth 1 -type d -name "neko*" | head -1)
          echo "Installed neko at: $NEKO_DIR"
          ls -la "$NEKO_DIR"
          echo "$PWD/$NEKO_DIR" >> $GITHUB_PATH
          echo "NEKOPATH=$PWD/$NEKO_DIR" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$PWD/$NEKO_DIR:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install hmm
        run: |
          haxelib --global upgrade haxelib
          haxelib --global install hmm

      - id: cache-hmm
        uses: actions/cache@v4
        with:
          path: ~/.haxelib
          key: haxe-hmm-android-${{ runner.os }}-4.3.6-${{ hashFiles('hmm.json') }}
          restore-keys: haxe-hmm-android-${{ runner.os }}-4.3.6-

      - name: Download git deps tarballs (prepare)
        if: steps.cache-hmm.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: python3 .github/install-deps.py prepare

      - name: Install haxelibs via hmm
        if: steps.cache-hmm.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          for i in {1..10}; do
            echo "Attempt $i / 10"
            if haxelib --global run hmm install -q; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Re-link git deps (dev override)
        timeout-minutes: 30
        run: python3 .github/install-deps.py dev

      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          ls "$ANDROID_SDK_ROOT/ndk/"
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --version

      - name: Install NDK r25c (25.2.9519653)
        timeout-minutes: 30
        run: |
          set -e
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # accept licenses
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "ndk;25.2.9519653"
          echo "=== NDK dirs after install ==="
          ls -la "$ANDROID_SDK_ROOT/ndk/"
          test -d "$ANDROID_SDK_ROOT/ndk/25.2.9519653" && echo "NDK r25c folder EXISTS: $ANDROID_SDK_ROOT/ndk/25.2.9519653"
          ls "$ANDROID_SDK_ROOT/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep -E "aarch64-linux-android-(clang|strip)" | head -5

      - name: Export Android env
        run: |
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          NDK_BIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -d "$NDK_DIR" || { echo "!! NDK r25c missing at $NDK_DIR"; exit 1; }
          # r25c ships host clang++ (hxcpp invokes it with --target=...), not a prefixed name
          test -x "$NDK_BIN/clang++" || { echo "!! clang++ missing in $NDK_BIN"; ls "$NDK_BIN" | head -30; exit 1; }
          # strip: llvm-strip, plus prefixed alias for lime
          test -x "$NDK_BIN/llvm-strip" || { echo "!! llvm-strip missing"; exit 1; }
          if [ ! -e "$NDK_BIN/aarch64-linux-android-strip" ]; then
            ln -sf "$NDK_BIN/llvm-strip" "$NDK_BIN/aarch64-linux-android-strip"
          fi
          # all NDK vars point at r25c
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          # NDK llvm bin FIRST in PATH (prepend, not append)
          echo "PATH=$NDK_BIN:$PATH" >> $GITHUB_ENV
          echo "NDK_BIN=$NDK_BIN" >> $GITHUB_ENV

      - name: Diagnostic - inspect lime ndll
        run: |
          echo "=== haxelib path lime ==="
          haxelib path lime 2>&1 || true
          echo "=== haxelib --never path lime ==="
          haxelib --never path lime 2>&1 || true
          echo "=== ls fork lime ndll ==="
          ls -la /tmp/haxelib-deps/lime/ndll/ 2>&1 | head -20
          ls -la /tmp/haxelib-deps/lime/ndll/Linux64/ 2>&1 | head -10
          echo "=== ls official lime 8.3.2 ndll ==="
          ls -la .haxelib/lime/8,3,2/ndll/ 2>&1 | head -20
          ls -la .haxelib/lime/8,3,2/ndll/Linux64/ 2>&1 | head -10
          echo "=== ldd fork lime.ndll ==="
          ldd /tmp/haxelib-deps/lime/ndll/Linux64/lime.ndll 2>&1 | head -20
          echo "=== ldd fork lime/Linux lime.ndll ==="
          ldd /tmp/haxelib-deps/lime/ndll/Linux/lime.ndll 2>&1 | head -20
          echo "=== neko version ==="
          neko -version 2>&1 || echo "neko not found"
          echo "=== END DIAG ==="

      - name: Setup lime android
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          # lime setup android needs ANDROID_SDK_ROOT set; pass path non-interactively
          haxelib --never run lime setup android 2>&1 | tail -5 || true
          # verify it registered
          grep -A3 "android" ~/.lime/config.xml 2>/dev/null | head -10 || echo "no config yet"

      - name: Verify NDK r25c toolchain
        run: |
          echo "PATH head: $(echo $PATH | tr ':' '\n' | head -3 | tr '\n' ' ')"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          which clang++
          which llvm-strip
          which aarch64-linux-android-strip
          clang++ --version | head -1

      - name: Build APK
        timeout-minutes: 60
        run: haxelib --never run lime build android -DEXCLUDE_ARMV7 -v -release -DGITHUB_BUILD

      - name: Upload APK (unsigned - sign on phone)
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Android-APK-unsigned
          path: |
            export/release/android/bin/**/*.apk
            export/android/bin/**/*.apk
          if-no-files-found: error
          retention-days: 14
